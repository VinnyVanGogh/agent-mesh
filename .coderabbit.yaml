language: "en-US"
tone_instructions: "Please provide a formal and constructive review. Focus on AST structure, deterministic linters, and architectural design."
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
chat:
  auto_reply: true
early_access: false
knowledge_base:
  learnings:
    enabled: true
visual_summaries:
  enabled: true
  type: mermaid
linters:
  ruff:
    enabled: true
  eslint:
    enabled: true
  biome:
    enabled: true
path_filters:
  - "!**/*.md"
  - "!**/dist/**"
  - "!**/build/**"
  - "!**/node_modules/**"
  - "!**/test/**"
  - "!**/tests/**"
