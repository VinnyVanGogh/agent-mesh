name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        go-version: [ '1.24', '1.25' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests (with race detector)
        run: go test -v -race ./...

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
        with:
          go-version-file: 'go.mod'
          go-package: ./...
        continue-on-error: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
        with:
          version: latest
        continue-on-error: true

      - name: Build Binaries (staypoint & staypointd)
        run: |
          go build -v -o bin/staypoint ./cmd/staypoint
          go build -v -o bin/staypointd ./cmd/staypointd

  release:
    name: Release Binaries
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
