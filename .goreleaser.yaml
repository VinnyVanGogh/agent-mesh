# GoReleaser Configuration for Staypoint
# Documentation at https://goreleaser.com
version: 2

project_name: staypoint

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: staypoint
    main: ./cmd/staypoint
    binary: staypoint
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

  - id: staypointd
    main: ./cmd/staypointd
    binary: staypointd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

nfpms:
  - id: staypoint
    package_name: staypoint
    vendor: VinnyVanGogh
    homepage: https://github.com/VinnyVanGogh/staypoint
    maintainer: Vince Vasile <stylesbyvinny@gmail.com>
    description: |-
      Staypoint AI agent ops: quota routing, checkpoints, circuit breaker, and daemon telemetry.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    builds:
      - staypoint
      - staypointd
    contents:
      - src: dist/linux/staypointd.service
        dst: /usr/lib/systemd/user/staypointd.service
        file_info:
          mode: 0644
    scripts:
      postinstall: dist/linux/postinstall.sh
      preremove: dist/linux/preremove.sh

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
